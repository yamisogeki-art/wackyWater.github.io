name: final1
description: WackySmart customer/driver mobile app with role-based routing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  cupertino_icons: ^1.0.6
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.0
  pdf: ^3.11.1
  printing: ^5.13.4
  url_launcher: ^6.3.1
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  google_mlkit_face_detection: ^0.11.0
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/wackysmart-app-icon-1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/wackysmart-app-icon-1024.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
